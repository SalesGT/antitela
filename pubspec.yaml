name: antitela
description: AntiTela - App de foco e bem-estar digital
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

# Evita erro de compilacao 'decodeLazy isn't defined for ZLibDecoder':
# image 4.11.x exige um archive mais novo do que o Flutter 3.35 consegue resolver.
dependency_overrides:
  image: 4.5.4
